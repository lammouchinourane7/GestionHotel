services:
  mysql:
    image: mysql:8.0
    container_name: hotel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hotel-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hotel-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8084:80"

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: hotel-eureka-server
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: hotel-api-gateway
    restart: unless-stopped
    depends_on:
      - eureka-server
    environment:
      SERVER_PORT: 8080
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      FRONTEND_ORIGIN: http://localhost:4200
    ports:
      - "8080:8080"

  client-service:
    build:
      context: .
      dockerfile: client-service/Dockerfile
    container_name: hotel-client-service
    restart: unless-stopped
    depends_on:
      - eureka-server
      - rabbitmq
    environment:
      SERVER_PORT: 8081
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8081:8081"

  room-service:
    build:
      context: .
      dockerfile: room-service/Dockerfile
    container_name: hotel-room-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SERVER_PORT: 8082
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
    ports:
      - "8082:8082"

  reservation-service:
    build:
      context: .
      dockerfile: reservation-service/Dockerfile
    container_name: hotel-reservation-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SERVER_PORT: 8083
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
    ports:
      - "8083:8083"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hotel-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "4200:80"

volumes:
  mysql_data:
