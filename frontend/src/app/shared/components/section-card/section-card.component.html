<section class="app-card p-6 md:p-7">
  <div class="mb-6 flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
    <div>
      <h2 class="font-display text-xl font-semibold text-slate-900">{{ title }}</h2>
      @if (description) {
        <p class="mt-1 text-sm text-slate-500">{{ description }}</p>
      }
    </div>
    @if (badge) {
      <span class="inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">
        {{ badge }}
      </span>
    }
  </div>

  <ng-content />
</section>
