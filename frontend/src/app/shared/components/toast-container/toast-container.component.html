<div class="pointer-events-none fixed right-4 top-4 z-[95] flex w-[min(24rem,calc(100%-2rem))] flex-col gap-3">
  @for (toast of notificationService.toasts(); track toast.id) {
    <article
      class="pointer-events-auto rounded-3xl border px-4 py-4 shadow-soft backdrop-blur-md transition duration-200"
      [class]="getToastClasses(toast.type)"
    >
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="text-sm font-bold">{{ toast.title }}</p>
          @if (toast.message) {
            <p class="mt-1 text-sm opacity-80">{{ toast.message }}</p>
          }
        </div>
        <button
          type="button"
          class="rounded-full p-1 text-current/70 transition hover:bg-white/50 hover:text-current"
          (click)="notificationService.dismiss(toast.id)"
        >
          <span class="sr-only">Fermer</span>
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
            <path d="M6 6 18 18M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </article>
  }
</div>
