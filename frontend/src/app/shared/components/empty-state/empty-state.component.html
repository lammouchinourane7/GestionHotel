<div class="app-card-muted flex flex-col items-center justify-center px-8 py-14 text-center">
  <div class="mb-5 grid h-16 w-16 place-items-center rounded-3xl bg-slate-900 text-white shadow-glass">
    <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none">
      <path
        d="M8 8h8M8 12h5m-7 8h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      />
    </svg>
  </div>
  <h3 class="font-display text-xl font-semibold text-slate-900">{{ title }}</h3>
  @if (description) {
    <p class="mt-2 max-w-md text-sm text-slate-500">{{ description }}</p>
  }
  @if (actionLabel && actionLink) {
    <a [routerLink]="actionLink" class="app-button-secondary mt-6">
      {{ actionLabel }}
    </a>
  }
</div>
