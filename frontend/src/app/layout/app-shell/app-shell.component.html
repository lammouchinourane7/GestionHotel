<div class="relative min-h-screen overflow-hidden">
  <div class="pointer-events-none absolute inset-0 opacity-90">
    <div class="absolute left-[10%] top-12 h-40 w-40 rounded-full bg-teal-200/30 blur-3xl"></div>
    <div class="absolute bottom-16 right-[8%] h-52 w-52 rounded-full bg-amber-200/30 blur-3xl"></div>
  </div>

  <app-sidebar
    [isOpen]="layoutService.sidebarOpen()"
    (closeSidebar)="layoutService.closeSidebar()"
  />

  <div class="relative min-h-screen lg:pl-72">
    <app-topbar (menuToggle)="layoutService.toggleSidebar()" />

    <main class="relative z-10 px-4 pb-12 pt-6 sm:px-6 lg:px-10">
      <router-outlet />
    </main>
  </div>
</div>
