@if (isOpen) {
  <button
    type="button"
    class="fixed inset-0 z-30 bg-slate-950/30 backdrop-blur-sm lg:hidden"
    (click)="closeSidebar.emit()"
  ></button>
}

<aside
  class="fixed inset-y-0 left-0 z-40 w-72 transform border-r border-white/50 bg-slate-950 px-5 py-6 text-slate-100 shadow-2xl transition duration-300 lg:translate-x-0"
  [class.translate-x-0]="isOpen"
  [class.-translate-x-full]="!isOpen"
>
  <div class="flex items-start justify-between gap-4">
    <div>
      <div class="mb-3 flex items-center gap-3">
        <div class="grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br from-teal-400 to-amber-300 text-base font-bold text-slate-950">
          HR
        </div>
        <div>
          <p class="font-display text-lg font-semibold">Hotel Reserve</p>
          <p class="text-sm text-slate-400">Admin dashboard</p>
        </div>
      </div>
    </div>

    <button
      type="button"
      class="rounded-2xl border border-white/10 p-2 text-slate-300 lg:hidden"
      (click)="closeSidebar.emit()"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
        <path d="M6 6 18 18M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </button>
  </div>

  <nav class="mt-8 space-y-2">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        [routerLinkActive]="'bg-white text-slate-950 shadow-glass'"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        class="group flex items-center gap-4 rounded-2xl px-4 py-3 text-sm text-slate-300 transition hover:bg-white/10 hover:text-white"
        (click)="closeSidebar.emit()"
      >
        <div class="grid h-10 w-10 place-items-center rounded-2xl border border-white/10 bg-white/5 text-xs font-bold uppercase">
          {{ item.label.slice(0, 1) }}
        </div>
        <div>
          <p class="font-semibold">{{ item.label }}</p>
          <p class="text-xs text-slate-400 group-[.bg-white]:text-slate-500">{{ item.description }}</p>
        </div>
      </a>
    }
  </nav>
</aside>
