<header class="sticky top-0 z-20 border-b border-white/60 bg-white/70 backdrop-blur-xl">
  <div class="flex items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-10">
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="grid h-11 w-11 place-items-center rounded-2xl border border-slate-200 bg-white text-slate-700 shadow-sm lg:hidden"
        (click)="menuToggle.emit()"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
          <path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>

      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.24em] text-teal-700">Plateforme de Reservation d Hotel</p>
      </div>
    </div>

    <div class="hidden items-center gap-3 md:flex">
      <div class="rounded-2xl border border-slate-200 bg-white px-4 py-2 shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Date</p>
        <p class="mt-1 text-sm font-medium text-slate-700">{{ now | date: 'fullDate' }}</p>
      </div>
    </div>
  </div>
</header>
