server:
  port: ${SERVER_PORT:8080}

app:
  security:
    enabled: ${AUTH_ENABLED:false}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/hotel-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8085/realms/hotel-realm/protocol/openid-connect/certs}
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "${FRONTEND_ORIGIN:http://localhost:4200}"
              - "${FRONTEND_ORIGIN_ALT:http://127.0.0.1:4200}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: client-service-route
          uri: lb://client-service
          predicates:
            - Path=/api/clients/**
        - id: room-service-route
          uri: lb://room-service
          predicates:
            - Path=/api/rooms/**
        - id: reservation-service-route
          uri: lb://reservation-service
          predicates:
            - Path=/api/reservations/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
